<!doctype html>
<html>
    <head>
        <title>Double Zoom</title>
        <style>
            /* Reset and basic setup */
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                background-color: #000; /* Dark background for letterboxing */
                overflow: hidden; /* Prevent scrollbars during animation */
            }

            img {
                display: block;
                position: absolute;
                object-fit: contain;
            }

            img.webvfx-video1 {
                animation: zoom-src var(--webvfx-animation-duration) linear
                    forwards;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            img.webvfx-video2 {
                animation: zoom-dst var(--webvfx-animation-duration) linear
                    forwards;
                bottom: 0;
                right: 0;
                width: 0%;
                height: 0%;
            }

            @keyframes zoom-src {
                0% {
                    width: 100%;
                    height: 100%;
                }
                100% {
                    width: 0%;
                    height: 0%;
                }
            }

            @keyframes zoom-dst {
                0% {
                    width: 0%;
                    height: 0%;
                }
                100% {
                    width: 100%;
                    height: 100%;
                }
            }
        </style>
    </head>
    <body>
        <img class="webvfx-video1" />
        <img class="webvfx-video2" />
    </body>
</html>
